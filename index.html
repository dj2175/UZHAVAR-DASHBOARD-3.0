 ops:(c,L)=>{const q=c.q,o=[
 [-14,'Spread FYM / compost and plough','land',`Spread FYM or compost 12.5 t/ha (about ${q(12.5)} t for your field) evenly on the unploughed field with Azospirillum 2 kg/ha and Phosphobacteria 2 kg/ha (or Azophos 4 kg/ha), then incorporate. Plough once with a disc plough and twice with a cultivator to a fine tilth.`],
 [-3,'Form ridges and furrows','land','Make ridges 6 m long and 60 cm apart with irrigation channels. Without ridges, form beds of 10 or 20 m² depending on water. A bund former or ridge plough cuts the cost.'],
 [0,'Micronutrients','fert',`TNAU: mix 12.5 kg/ha of the Tamil Nadu Agriculture Department micronutrient mixture with sand to make 50 kg (about ${q(12.5)} kg of mixture for your field). Apply over the furrows and two-thirds up the ridge tops; do not mix it into the soil. Hybrid maize in zinc-deficient soil: zinc sulphate 37.5 kg/ha (about ${q(37.5)} kg).`],
 [0,'Seed treatment and sowing','land',`Seed needed about ${q(20)} kg (20 kg/ha for CO 1 and TNAU hybrid CO 6; 25 kg/ha for baby corn CO(BC) 1). Treat seed with imidacloprid 70 WS 10 g/kg (stem borer), then Metalaxyl or Thiram 2 g/kg (downy mildew, crazy top), then Azospirillum 600 g/ha. Dibble 4 cm deep along the fertilised furrow, 25 cm between plants and 60 cm between rows (6–7 plants/m²). One seed per hole if germination is sure, otherwise two.`],
 [0,'Irrigate after sowing','water','Life irrigation straight after sowing, then follow the stage-wise schedule in this calendar.'],
 [4,'Pre-emergence herbicide','weed','Atrazine 0.25 kg/ha at 3–5 days after sowing, sprayed on moist soil with a flat-fan nozzle in 500 litres of water/ha. Do not disturb the soil afterwards. If a pulse is intercropped, do NOT use atrazine; spray pendimethalin 0.75 kg/ha instead.'],
 [13,'Thin to one plant per hole','land','At 12–15 days keep one healthy plant per hole. Where seeds failed, dibble pre-soaked seeds (2 per hole) and irrigate at once.'],
 [30,'Hoeing, hand weeding and earthing up','weed','Hoe and hand-weed on the 30th day (TNAU: one hand weeding at 30–35 days after atrazine). Earth up and form new ridges so the plants sit on top of the ridge for extra anchorage.'],
 [45,'Critical moisture period starts','water','Days 45–65 are the most critical for water. Stress now cuts yield by a large margin. Irrigate on schedule.']
 ].concat(IRG(MZ_IR(L),L),[
 [c.D-5,'Check maturity','harvest','Cob sheath turns yellow and dry and the grains are fairly hard and dry. Harvest at that stage, whatever the calendar says.'],
 [c.D,'Harvest','harvest','Tear off the cob sheath (a gunny needle helps) and remove the cobs. Harvest everything at one stage for easy transport.'],
 [c.D+3,'Dry cobs and thresh','harvest','Dry cobs in the sun until the grain is dry. Thresh with a mechanical thresher or by running a tractor over dried cobs, winnow, and store dry grain in gunny bags. Green maize straw chopped with a chaff cutter is good cattle feed.']]);return o},

 [-14,'FYM and field preparation','land',`Spread FYM or compost 12.5 t/ha (about ${q(12.5)} t) evenly on the unploughed field with Azospirillum 2 kg/ha and Phosphobacteria 2 kg/ha (or Azophos 4 kg/ha) and incorporate. If there is a hard pan, chisel the soil once in three years at 0.5 m intervals in two directions; chiselling plus 12.5 t/ha FYM gave about 30% more yield than the control (TNAU).`],

 ops:(c,L)=>{const q=c.q;return[
 [-14,'Spread FYM and plough','land',`Spread FYM or composted coir pith 12.5 t/ha (about ${q(12.5)} t) with Azospirillum 2 kg/ha and Phosphobacteria 2 kg/ha (or Azophos 4 kg/ha) on the unploughed field and incorporate. Well-decomposed poultry manure 5 t/ha improves yield and soil structure. Plough once or twice with an iron plough; direct-sown sorghum does NOT need a fine tilth (it hurts germination).`],
 [-3,'Form ridges and furrows','land','Ridges 6 m long and 45 cm apart with irrigation channels across the furrows, or beds of 10–20 m² depending on water.'],
 [0,'Micronutrients','fert',`Mix 12.5 kg/ha of the Tamil Nadu Agriculture Department micronutrient mixture with sand to make 50 kg and spread on the beds (about ${q(12.5)} kg of mixture for your field). Zinc-deficient soil: ZnSO₄ 25 kg/ha (about ${q(25)} kg), or 12.5 kg/ha with FYM. Iron-deficient soil: FeSO₄ 50 kg/ha with 12.5 t/ha FYM.`],
 [0,'Seed treatment and sowing','land',`Seed needed about ${q(10)} kg (10 kg/ha direct sown). Treat seed 24 hours earlier with carbendazim, captan or thiram 2 g/kg, then Azospirillum 600 g + Phosphobacteria 600 g per ha using rice gruel as binder. Sow 2 cm deep over the lines where fertilizer was placed, 15 cm between seeds in rows 45 cm apart (about 15 plants/m²), one plant per hill.`],
 [4,'Pre-emergence herbicide','weed','Atrazine 0.25 kg/ha at 3–5 days after sowing, in 500 litres of water/ha with a flat-fan nozzle. If a pulse is intercropped, do NOT use atrazine; use pendimethalin 0.75 kg/ha.'],
 [22,'2,4-D spray (or hand weeding)','weed','2,4-D 1 kg/ha at 20–25 days. If you do not use herbicides, hand weed twice, at 10–15 and 30–35 days after sowing.'],
 [23,'Thin and gap-fill','land','After the first hand weeding, thin to 15 cm between plants and gap-fill with the thinned seedlings. If shoot fly attacks, remove side shoots and keep one healthy shoot.'],
 [32,'Hand weeding','weed','One hand weeding at 30–35 days after sowing (after atrazine).']

 [0,'Sow before the monsoon','land',`Seed needed about ${q(15)} kg (15 kg/ha). Sow 5 cm deep with a seed drill or country plough at 45 × 15 cm (or 45 × 10 cm). TNAU optimum pre-monsoon sowing: Coimbatore 37–38th week (2nd–3rd week of September); Erode 38th week; Sivaganga and Ramanathapuram 40th week (1st week of October); Thoothukudi 39–40th week; Vellore and Tiruvannamalai 37–38th week. Optimum rain is 250–300 mm, evenly spread.`],

const MZP=[['Nitrogen deficiency','Leaves become yellow, older leaves dry from the tips along the mid-vein, stalks become slender. (TNAU)'],['Phosphorus deficiency','Leaves purplish green in early growth; spindly growth, slow maturity, irregular ear formation. (TNAU)'],['Potassium deficiency','Yellow or yellowish-green streaks, corrugated leaves, tip and margin scorch; poorly filled ear tips; short internodes and weak plants that may fall. (TNAU)'],['Magnesium deficiency','Older leaves turn chlorotic at the margins and between veins, giving a streaked look; necrotic or chlorotic spots. (TNAU)'],['Zinc deficiency','Older leaves show yellow streaks or chlorotic striping between veins; young leaves may unfold white or yellow. TNAU: zinc sulphate 37.5 kg/ha for hybrid maize in zinc-deficient soil.'],['Iron deficiency','Interveinal chlorosis; the whole crop may look bleached. (TNAU)'],['Moisture stress or waterlogging','TNAU: maize is sensitive to both. The most critical phase is 45–65 days after sowing.']];

function fcRes(p,s){const ha=s.unit==='ha'?s.area:s.unit==='cent'?s.area/100/HA:s.area/HA,T={n:0,p:0,k:0,u:0,d:0,s:0,m:0};
 const rows=s.rows.map(r=>{const n=s.npk[0]*ha*r[2]/100,pp=s.npk[1]*ha*r[3]/100,k=s.npk[2]*ha*r[4]/100,dap=s.psrc==='dap'?pp/.46:0,ssp=s.psrc==='ssp'?pp/.16:0,u=Math.max(0,(n-dap*.18)/.46),m=k/.6;T.n+=n;T.p+=pp;T.k+=k;T.u+=u;T.d+=dap;T.s+=ssp;T.m+=m;return[r[1],fmt(addDays(p.sow,r[0])),r1(n),r1(pp),r1(k),r1(u),r1(dap),r1(ssp),r1(m)]});
 const sum=j=>s.rows.reduce((a,r)=>a+r[j],0),warn=[[0,2,'N'],[1,3,'P₂O₅'],[2,4,'K₂O']].filter(([i,j])=>s.npk[i]>0&&Math.abs(sum(j)-100)>.5).map(([i,j,n])=>`${n} stages add up to ${r1(sum(j))}%, not 100%.`);

 return(warn.length?`<div class="note" style="border-color:var(--red)">⚠️ ${warn.join(' ')}</div>`:'')+`<div class="scroll"><table><tr><th>Stage</th><th>Date</th><th>N kg</th><th>P₂O₅ kg</th><th>K₂O kg</th><th>Urea kg</th><th>DAP kg</th><th>SSP kg</th><th>MOP kg</th></tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i>1&&i<5?c:i>4&&c===0?'–':c}</td>`).join('')}</tr>`).join('')}<tr><td colspan="2"><b>Total</b></td><td><b>${r1(T.n)}</b></td><td><b>${r1(T.p)}</b></td><td><b>${r1(T.k)}</b></td><td><b>${r1(T.u)}</b></td><td><b>${r1(T.d)}</b></td><td><b>${r1(T.s)}</b></td><td><b>${r1(T.m)}</b></td></tr></table></div><p class="muted" style="margin-top:8px">Bags: urea${bag(T.u,45)||' –'} (45 kg bag) · DAP${bag(T.d,50)||' –'} · SSP${bag(T.s,50)||' –'} · MOP${bag(T.m,50)||' –'} (50 kg bags). ${s.psrc==='dap'?'Nitrogen supplied by DAP (18% N) is already taken off the urea.':''}</p>`}

${inp('fcN',s.npk[0],'N kg per hectare')}${inp('fcP',s.npk[1],'P₂O₅ kg per hectare')}${inp('fcK',s.npk[2],'K₂O kg per hectare')}

<div class="row"><button class="btn" onclick="frAdd()">Add to register</button><span id="rgm" class="muted"></span></div>

const TIP={sow:['keep the soil moist and fill any gaps early','மண் ஈரம் குறையாமல் பார்த்துக்கொண்டு, முளைக்காத இடங்களில் சீக்கிரம் விதை இடுங்கள்'],veg:['keep the field free of weeds and give fertilizer on the planned day','வயலில் களை இல்லாமல் பார்த்துக்கொண்டு, திட்டமிட்ட நாளில் உரம் இடுங்கள்'],crit:['this is the most sensitive stage, so never let the crop go dry','இது மிகவும் முக்கியமான நிலை; பயிர் வறண்டுபோகாமல் பார்த்துக்கொள்ளுங்கள்'],fill:['watch for pests and keep enough moisture while the grains or pods fill','தானியம் அல்லது காய் பிடிக்கும் நேரம்; பூச்சிகளைக் கவனித்து, போதுமான ஈரம் வையுங்கள்'],harv:['keep your labour or machines ready and finish the harvest within three to four days','ஆட்கள் அல்லது இயந்திரங்களைத் தயாராக வைத்து, மூன்று நான்கு நாட்களில் அறுவடையை முடியுங்கள்']};
const HRAIN={rice:['Rain is expected, and the paddy plants may lodge, so harvest within one to two days.','மழை எதிர்பார்க்கப்படுகிறது; நெற்பயிர் சாய்ந்துவிடும் அபாயம் உள்ளது. எனவே ஒன்று இரண்டு நாட்களுக்குள் அறுவடை செய்யுங்கள்.'],groundnut:['Rain can rot pods in wet soil, so lift the pods and dry them under cover within one to two days.','மழையில் ஈர மண்ணில் காய்கள் அழுகிவிடும்; ஒன்று இரண்டு நாட்களுக்குள் பிடுங்கி, மூடிய இடத்தில் உலர்த்துங்கள்.'],any:['Rain is expected, and wet grain can spoil or sprout, so harvest within one to two days and dry it under cover.','மழை எதிர்பார்க்கப்படுகிறது; ஈரமான தானியம் கெட்டுவிடலாம் அல்லது முளைத்துவிடலாம். எனவே ஒன்று இரண்டு நாட்களுக்குள் அறுவடை செய்து மூடிய இடத்தில் உலர்த்துங்கள்.']};
function stageOf(p){const st=stages(p).st,ix=-daysTo(p.sow),i=st.filter(q=>q[1]<=ix).length-1;if(i<0)return null;const q=st[i],n=st.length;
 const cat=i===0?'sow':i===n-1?'harv':(/CRITICAL/i.test(q[2]||'')||/flower|tassel|peg|panicle|silk|boot|heading/i.test(q[0]))?'crit':i===n-2?'fill':'veg';return{name:q[0],cat}}
function brief(lg,Q){return L2(lg,()=>{const u=DB[me],lv=L(),t=today(),o=[],K=[],nm=(NB().prof.name||'').trim();
 u.plans.forEach(p=>dated(p).ops.forEach(x=>{const d=daysTo(x.iso);if(!(p.done&&p.done[x.k])&&d<=0&&d>=-10)K.push(tr(p.variety||CROPS[p.crop])+': '+tr(x.t))}));
 o.push(S('Hello'+(nm?' '+nm:'')+'! Here is how your farm looks today.','வணக்கம்'+(nm?' '+nm:'')+'! இன்றைய பண்ணை நிலவரத்தைச் சொல்கிறேன்.'));
 let h=null;
 if(Q){const d=Q.j.daily,{r,P,X,W}=H(d);h={r,P,X,W,rain3:r(0)+r(1)+r(2),wet:r(0)+r(1)+r(2)>=15||Math.max(P(0),P(1),P(2))>=70,heavy:Math.max(r(0),r(1),r(2))>=64.5};
  const wE=i=>{const m=r(i);return m<1?'no rain':m<8?'light rain':m<30?'moderate rain':'heavy rain'},wT=i=>{const m=r(i);return m<1?'மழை இருக்காது':m<8?'லேசான மழை பெய்யலாம்':m<30?'மிதமான மழை பெய்யலாம்':'கனமழை பெய்யலாம்'};
  o.push(S(`Today there will be ${wE(0)}, with a high of ${Math.round(X(0))} degrees. Tomorrow expect ${wE(1)}, and the day after tomorrow ${wE(2)}.`,`இன்று ${wT(0)}; அதிகபட்ச வெப்பம் ${Math.round(X(0))} டிகிரி. நாளை ${wT(1)}; நாளை மறுநாள் ${wT(2)}.`));
  const sd=[0,1,2].find(i=>r(i)<1&&P(i)<30&&W(i)<15);
  o.push(sd===0?S('You can spray today. Spray in the morning.','இன்று மருந்து தெளிக்கலாம். காலையில் தெளியுங்கள்.'):sd==null?S('There is no good day to spray in the next few days because of rain or wind, so please wait.','மழை அல்லது காற்று இருப்பதால் அடுத்த சில நாட்களுக்கு மருந்து தெளிக்க நல்ல நாள் இல்லை; காத்திருங்கள்.'):S('Do not spray today. '+(sd===1?'Tomorrow':'The day after tomorrow')+' is better, in the morning.','இன்று மருந்து தெளிக்க வேண்டாம். '+(sd===1?'நாளை':'நாளை மறுநாள்')+' காலையில் தெளிப்பது நல்லது.'));
  const w=warns(d).filter(z=>!/spray|தெளிக்க|தெளிக்கவோ/i.test(z[1])||z[0]>=1);if(w.length)o.push(S('Please take care. ','கவனமாக இருங்கள். ')+w.slice(0,3).map(z=>z[1]).join(' '))}
 else o.push(S('Pick your place in the Weather page and I will tell you the weather advice too.','வானிலைப் பக்கத்தில் உங்கள் ஊரைத் தேர்ந்தெடுத்தால், வானிலை ஆலோசனையும் சொல்வேன்.'));
 o.push(K.length?S(K.length===1?'You have one job today. '+K[0]+'.':'You have '+K.length+' jobs today. '+K.slice(0,4).join('. Then, ')+'.','இன்றைக்கு '+K.length+' வேலை இருக்குங்க. '+K.slice(0,4).join('. அடுத்து, ')+'.'):S('Nothing is pending in your calendar today.','இன்றைக்குக் காலண்டரில் நிலுவை வேலை எதுவும் இல்லை.'));
 u.plans.forEach(p=>{const n=tr(p.variety||CROPS[p.crop]),ix=-daysTo(p.sow);
  if(p.crop==='coconut'){o.push(S('For your coconut, keep up the palm care tasks in the calendar.','தென்னைக்கு, காலண்டரில் உள்ள பராமரிப்பு வேலைகளைத் தொடர்ந்து செய்யுங்கள்.'));return}
  if(ix>+p.dur+5)return;
  if(ix<0){o.push(S(n+' is not sown yet. Get the field ready.',n+' இன்னும் விதைக்கப்படவில்லை; வயலைத் தயார் செய்யுங்கள்.'));return}
  const sg=stageOf(p);if(!sg)return;const tp=TIP[sg.cat];
  o.push(S(n+' is in the '+sg.name.replace(/\s*stage$/i,'')+' stage. '+tp[0][0].toUpperCase()+tp[0].slice(1)+'.',n+' இப்போது '+tr(sg.name)+' நிலையில் உள்ளது. '+tp[1]+'.'));
  if(h){const rs=HRAIN[p.crop]||HRAIN.any;
   if(sg.cat==='harv'&&(h.wet||h.rain3>=5))o.push(S(rs[0],rs[1]));
   else if(sg.cat==='crit'&&(h.heavy||h.W(0)>=40||h.W(1)>=40))o.push(S('Heavy rain or strong wind can harm this stage, so do not spray or fertilize until it passes.','இந்த நிலையில் கனமழை அல்லது பலத்த காற்று பாதிக்கும்; அது முடியும் வரை மருந்தோ உரமோ இட வேண்டாம்.'));
   else if((sg.cat==='crit'||sg.cat==='fill')&&h.rain3<3)o.push(S('No rain is expected soon, so irrigate if you can.','விரைவில் மழை இல்லை; முடிந்தால் நீர் பாய்ச்சுங்கள்.'));
   else if(h.heavy)o.push(S('Heavy rain is coming, so drain extra water from the field.','கனமழை வருகிறது; வயலில் தேங்கும் நீரை வடியுங்கள்.'))}});
 const m=tot(lv,t);if(lv.cows.length)o.push(S('You have '+lv.cows.length+' cows. '+(m?'Milk noted today is '+m.toFixed(1)+' litres.':'Today\'s milk is not noted yet. Just tap the mic and tell me.'),lv.cows.length+' மாடுகள் இருக்கு. '+(m?'இன்று பதிவான பால் '+m.toFixed(1)+' லிட்டர்.':'இன்றைய பால் இன்னும் பதிவாகவில்லை; மைக்கை அழுத்தி என்னிடம் சொல்லுங்கள்.')));
 if(lv.hens)o.push(S(lv.eggs[t]!=null?'Eggs today: '+lv.eggs[t]+'.':'Eggs are not noted yet today.',lv.eggs[t]!=null?'இன்றைய முட்டை '+lv.eggs[t]+'.':'இன்றைய முட்டை இன்னும் பதிவாகவில்லை.'));
 return o.join(' ')})}

async function place(a,b){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1&accept-language=en&lat=${a}&lon=${b}`),j=(await r.json()).address||{},v=j.village||j.hamlet||j.suburb||j.neighbourhood||j.town||j.city,t=j.town||j.city||j.county||j.state_district;return[v,t&&t!==v?t:'',j.state].filter(Boolean).join(', ')}catch(e){try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${a}&longitude=${b}&localityLanguage=en`),j=await r.json();return[j.locality||j.city,j.principalSubdivision].filter(Boolean).join(', ')}catch(e2){return''}}}

let tI=0;
const tClr=()=>document.querySelectorAll('.tuthl').forEach(e=>e.classList.remove('tuthl'));
function startTut(){tI=0;tShow()}
function tEnd(){tClr();document.getElementById('tut').classList.remove('on');js('uz_tut',1)}
function tGo(n){tI=Math.max(0,Math.min(TUT.length-1,tI+n));tShow()}
function tShow(){const s=TUT[tI],t=document.getElementById('tut'),L=tI===TUT.length-1;tClr();if(s.pg&&(nav!==s.pg||cur!==null))go(s.pg);
 t.innerHTML=`<div class="dots">${TUT.map((_,i)=>`<i class="${i===tI?'on':''}"></i>`).join('')}</div><h3 style="margin:8px 0 4px">${S(s.t[0],s.t[1])}</h3><p style="font-size:14px">${S(s.d[0],s.d[1])}</p><div class="row" style="margin-top:12px"><button class="btn alt sm" ${tI?'':'disabled'} onclick="tGo(-1)">← ${S('Back','பின்')}</button><button class="btn sm" onclick="${L?'tEnd()':'tGo(1)'}">${L?S('Finish','முடி'):S('Next','அடுத்து')} →</button><button class="btn alt sm" style="margin-left:auto" onclick="tEnd()">${S('Close','மூடு')}</button><span class="muted">${tI+1}/${TUT.length}</span></div>`;t.classList.add('on');
 setTimeout(()=>{const e=s.sel&&document.querySelector(s.sel);if(e){e.classList.add('tuthl');if(s.sel!=='aside'&&s.sel!=='#vfab'&&s.sel!=='.don')e.scrollIntoView({behavior:'smooth',block:'center'})}else scrollTo({top:0,behavior:'smooth'})},300)}
